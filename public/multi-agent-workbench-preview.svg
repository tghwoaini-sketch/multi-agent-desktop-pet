<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#384338" flood-opacity=".10"/></filter>
    <style>
      .serif{font-family:Georgia,'Noto Serif SC','Songti SC',serif}.sans{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif}.muted{fill:#8c897e}.ink{fill:#283129}.line{stroke:#ded9cb}.green{fill:#68886d}.brown{fill:#a68143}.red{fill:#c85b43}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f5f1e8"/>
  <rect x="0" y="0" width="224" height="900" fill="#e6ede1"/>
  <path d="M224 0v900" stroke="#d4ddcf" stroke-width="2"/>
  <g class="sans">
    <text x="42" y="58" font-size="12" letter-spacing="3" class="muted">PERSONAL WORKBENCH</text>
    <text x="42" y="104" font-size="27" class="ink" font-weight="600">小步修仙</text>
    <text x="42" y="130" font-size="13" class="muted">个人工作台</text>
    <g transform="translate(30 190)"><rect width="164" height="54" rx="16" fill="#fffdf9" stroke="#adc0a8" stroke-width="2"/><text x="18" y="33" font-size="15" class="green" font-weight="600">山　当前道场</text></g>
    <text x="50" y="292" font-size="14" class="muted">日　日常修炼</text><text x="50" y="344" font-size="14" class="muted">工　工作洞府</text><text x="50" y="396" font-size="14" class="muted">诀　知识与技巧</text>
    <line x1="42" y1="456" x2="180" y2="456" class="line"/><text x="42" y="502" font-size="12" class="muted" letter-spacing="2">当前心法</text><text x="42" y="535" font-size="13" class="ink">同时只推进四五件事</text><text x="42" y="560" font-size="13" class="muted">旧任务不消失</text><text x="42" y="582" font-size="13" class="muted">只是不进入视线</text>
  </g>
  <g transform="translate(264 46)" class="sans">
    <text x="0" y="18" font-size="12" letter-spacing="3" class="muted">CURRENT WORKING SET</text>
    <text x="0" y="66" font-size="34" class="ink" font-weight="600">当前道场</text>
    <text x="0" y="94" font-size="14" class="muted">只看此刻正在推进的五件事</text>
    <g transform="translate(0 124)"><rect width="1116" height="70" rx="18" fill="#fffdf9" stroke="#ded9cb"/><circle cx="28" cy="35" r="7" fill="#6e956f"/><text x="46" y="41" font-size="15" class="green" font-weight="600">Codex 已连接</text><circle cx="220" cy="35" r="7" fill="#6e956f"/><text x="238" y="41" font-size="15" class="green" font-weight="600">WorkBuddy 已连接</text><rect x="830" y="13" width="150" height="44" rx="12" fill="#f4efe5"/><text x="850" y="41" font-size="14" class="ink">当前任务　4 / 5</text><text x="1004" y="41" font-size="13" class="muted">每 3 秒更新</text></g>
    <text x="0" y="246" font-size="14" class="muted">五席主看板</text>
    <g transform="translate(0 268)" filter="url(#shadow)">
      <rect width="1116" height="188" rx="20" fill="#fffdf9" stroke="#91aa8e" stroke-width="2"/><text x="26" y="34" font-size="12" class="green">01　CODEX</text><text x="1040" y="34" font-size="18" class="muted">⚑</text><text x="26" y="76" font-size="25" class="serif ink">设计实时任务进程看板</text><rect x="26" y="98" width="760" height="56" rx="11" fill="#f3eee4"/><text x="44" y="121" font-size="12" class="muted">上次停在</text><text x="44" y="142" font-size="14" class="ink">固定五席 + 自动识别 Agent 状态</text><rect x="822" y="102" width="128" height="38" rx="10" fill="#e5eee3"/><text x="850" y="127" font-size="14" class="green" font-weight="600">正在处理</text><text x="980" y="126" font-size="13" class="muted">刚刚更新</text>
    </g>
    <g transform="translate(0 474)"><rect width="1116" height="188" rx="20" fill="#fffdf9" stroke="#ded9cb"/><text x="26" y="34" font-size="12" class="brown">02　WORKBUDDY</text><text x="1040" y="34" font-size="18" class="muted">⚑</text><text x="26" y="76" font-size="25" class="serif ink">整理电脑文件结构</text><rect x="26" y="98" width="760" height="56" rx="11" fill="#f3eee4"/><text x="44" y="121" font-size="12" class="muted">上次停在</text><text x="44" y="142" font-size="14" class="ink">等待你确认分类规则与高频目录</text><rect x="822" y="102" width="128" height="38" rx="10" fill="#fae9df"/><text x="850" y="127" font-size="14" class="red" font-weight="600">需要你</text><text x="980" y="126" font-size="13" class="muted">12 分钟前</text></g>
    <g transform="translate(0 680)"><rect width="1116" height="100" rx="20" fill="#edf2e9" stroke="#d7e0d3"/><text x="30" y="38" font-size="12" letter-spacing="2" class="green">AGENT LANES</text><text x="30" y="70" font-size="15" class="ink" font-weight="600">Codex　3 个任务</text><text x="310" y="70" font-size="15" class="ink" font-weight="600">WorkBuddy　2 个任务</text><text x="750" y="70" font-size="14" class="muted">点击 Agent 名称查看该 Agent 的全部活动</text></g>
  </g>
  <g transform="translate(1230 46)" class="sans"><rect width="170" height="734" rx="20" fill="#fffdf9" stroke="#ded9cb"/><text x="24" y="40" font-size="13" letter-spacing="2" class="muted">需要你</text><circle cx="133" cy="35" r="18" fill="#fae9df"/><text x="127" y="41" font-size="13" class="red">1</text><line x1="24" y1="62" x2="146" y2="62" class="line"/><circle cx="30" cy="96" r="5" fill="#c85b43"/><text x="46" y="100" font-size="13" class="ink">WorkBuddy</text><text x="24" y="133" font-size="14" class="ink" font-weight="600">整理电脑文件</text><text x="24" y="160" font-size="12" class="muted">等待你的确认</text><line x1="24" y1="190" x2="146" y2="190" class="line"/><text x="24" y="240" font-size="13" letter-spacing="2" class="muted">状态说明</text><g font-size="12"><circle cx="30" cy="278" r="5" fill="#6e956f"/><text x="46" y="282" class="muted">正在处理</text><circle cx="30" cy="318" r="5" fill="#a68143"/><text x="46" y="322" class="muted">等待 Agent</text><circle cx="30" cy="358" r="5" fill="#c85b43"/><text x="46" y="362" class="muted">需要你</text><circle cx="30" cy="398" r="5" fill="#98958c"/><text x="46" y="402" class="muted">暂时搁置</text></g><rect x="24" y="650" width="122" height="44" rx="12" fill="#f3eee4"/><text x="48" y="677" font-size="13" class="ink">任务库　›</text></g>
</svg>
